<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حمودي وفوفو - مشاركة المشاعر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <section id="login-screen" class="screen active">
    <div class="login-container">
      <div class="logo-area">
        <div class="logo-icon">
          <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M32 12c-8 0-14 6-14 14 0 6 3 10 6 12v6c0 4 4 8 8 8s8-4 8-8v-6c3-2 6-6 6-12 0-8-6-14-14-14z"/>
            <path d="M28 44v4c0 2 2 4 4 4s4-2 4-4v-4"/>
            <circle cx="26" cy="26" r="2" fill="currentColor" stroke="none"/>
            <circle cx="38" cy="26" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <h1 class="logo-title">حمودي وفوفو</h1>
        <p class="logo-subtitle">مساحة خاصة لمشاركة المشاعر</p>
      </div>

      <div class="user-selection">
        <p class="select-label">اختر من أنت</p>
        <div class="user-cards">
          <button class="user-card" data-user="فوفو" type="button">
            <div class="card-avatar">
              <img src="https://i.imgur.com/Mcy6ytn.jpg" alt="فوفو" class="avatar-img" loading="lazy">
            </div>
            <span class="card-name">فوفو</span>
            <span class="card-hint">اضغط للدخول</span>
          </button>

          <button class="user-card" data-user="حمودي" type="button">
            <div class="card-avatar">
              <img src="https://i.imgur.com/DcH5BQ5.jpg" alt="حمودي" class="avatar-img" loading="lazy">
            </div>
            <span class="card-name">حمودي</span>
            <span class="card-hint">اضغط للدخول</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- شاشة لوحة التحكم -->
  <section id="dashboard-screen" class="screen">
    <div class="dashboard-container">
      <!-- الهيدر -->
      <header class="dashboard-header">
        <button id="logout-btn" class="logout-btn" title="تسجيل الخروج" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
        <div class="welcome-area">
          <h2 id="welcome-text">مرحباً</h2>
          <p class="welcome-sub">كيف تشعر اليوم؟</p>
        </div>
        <div class="header-spacer"></div>
      </header>

      <!-- قسم مشاعري الحالية -->
      <div class="section my-feelings">
        <div class="section-header">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </div>
          <h3 class="section-title">مشاعري الحالية</h3>
        </div>

        <div class="feelings-grid" id="feelings-grid">
          <label class="feeling-option">
            <input type="radio" name="feeling" value="سعيد">
            <span class="feeling-box">
              <span class="feeling-label">سعيد</span>
              <span class="feeling-desc">أشعر بالفرح والرضا</span>
            </span>
          </label>

          <label class="feeling-option">
            <input type="radio" name="feeling" value="حزين">
            <span class="feeling-box">
              <span class="feeling-label">حزين</span>
              <span class="feeling-desc">أحتاج لبعض الدعم</span>
            </span>
          </label>

          <label class="feeling-option">
            <input type="radio" name="feeling" value="تعبان">
            <span class="feeling-box">
              <span class="feeling-label">تعبان</span>
              <span class="feeling-desc">أحتاج للراحة</span>
            </span>
          </label>

          <label class="feeling-option">
            <input type="radio" name="feeling" value="نعسان">
            <span class="feeling-box">
              <span class="feeling-label">نعسان</span>
              <span class="feeling-desc">أريد أن أنام</span>
            </span>
          </label>
        </div>

        <!-- شعور مخصص -->
        <div class="custom-feeling-area">
          <p class="custom-label">أو أضف شعوراً مخصصاً</p>
          <div class="custom-input-group">
            <input type="text" id="custom-feeling-input" placeholder="اكتب شعورك هنا..." maxlength="30">
            <button id="add-custom-btn" class="btn-add" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>إضافة</span>
            </button>
          </div>
        </div>
      </div>

      <!-- قسم حالة الطرف الآخر -->
      <div class="section other-feeling">
        <div class="section-header">
          <div class="section-icon other-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <h3 class="section-title" id="other-title">حالة الطرف الآخر</h3>
        </div>

        <div class="other-status-card" id="other-status-card">
          <div class="status-indicator">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-text" id="other-feeling-text">جاري التحميل...</span>
          </div>
          <p class="status-time" id="status-time"></p>
        </div>
      </div>

      <!-- رسالة النجاح -->
      <div id="success-toast" class="toast">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span>تم تحديث شعورك بنجاح</span>
      </div>
    </div>
  </section>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Main App -->
  <script src="main.js"></script>
</body>
</html>
